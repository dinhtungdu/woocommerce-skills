<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1504, height=1012" />
    <script src="./gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1504px; height: 1012px; overflow: hidden; }
      body {
        background: #edf0f5;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #272239;
      }
      #main { position: relative; width: 1504px; height: 1012px; }
      #frame {
        position: absolute; left: 32px; top: 32px; width: 1440px; height: 900px;
        border-radius: 8px; overflow: hidden; background: #fff;
        box-shadow: 0 0 0 1px #27223914;
      }
      #camera { width: 1440px; height: 900px; }
      video { display: block; width: 100%; height: 100%; object-fit: contain; }
      #caption { position: absolute; left: 32px; top: 948px; width: 1440px; height: 48px; }
      .beat { position: absolute; inset: 0; display: flex; align-items: center; }
      .text { font-size: 26px; font-weight: 550; letter-spacing: -.02em; }
    </style>
  </head>
  <body>
    <!-- Adapt dimensions, durations and captions to the real take. Keep framing still unless focus requires a move. -->
    <main id="main" data-composition-id="main" data-start="0" data-duration="12"
      data-width="1504" data-height="1012" data-fps="60">
      <div id="frame">
        <div id="camera" data-layout-allow-overflow>
          <video id="footage" class="clip" src="./source.mp4" muted playsinline
            data-start="0" data-duration="12" data-media-start="0" data-track-index="0"></video>
        </div>
      </div>
      <div id="caption">
        <div id="starting-state" class="beat clip" data-start="0" data-duration="3" data-track-index="1">
          <span class="text">Inspect the starting state</span>
        </div>
        <div id="interaction" class="beat clip" data-start="3" data-duration="4" data-track-index="1">
          <span class="text">Apply the change</span>
        </div>
        <div id="result" class="beat clip" data-start="7" data-duration="5" data-track-index="1">
          <span class="text">Check the result</span>
        </div>
      </div>
    </main>
    <script>
      const timeline = gsap.timeline({ paused: true });
      timeline.set('#camera', { scale: 1 }, 12);
      window.__timelines = window.__timelines || {};
      window.__timelines.main = timeline;
      timeline.seek(0);
    </script>
  </body>
</html>
